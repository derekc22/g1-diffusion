# Stage 2: p([robot, object] | hands, final object goal).

root_dir: "./data/hf_bps_preprocessed"

train:
  batch_size: 16
  num_epochs: 10000
  lr: 5e-6
  timesteps: 1000
  beta_start: 1e-4
  beta_end: 0.02
  prediction_type: "x0"
  device: "cuda:0"
  architecture: "transformer"
  save_dir: "./logs"
  save_every: 100
  exp_prefix: "object_goal_stage2_goal_only_hf_bps"
  num_workers: 4
  log_every: 50
  max_grad_norm: 1.0
  seed: 42

dataset:
  window_size: 300
  stride: 10
  min_seq_len: 30
  train_split: 0.99
  preload: true
  balance_by_object: false

model:
  state_dim: 47
  cond_dim: 6
  global_cond_dim: 9
  contact_dim: 0
  max_len: 300
  global_cond_hidden: 512
  mlp_hidden: 512
  mlp_layers: 4
  d_model: 512
  nhead: 8
  num_layers: 8
  dim_feedforward: 512
  dropout: 0.1
